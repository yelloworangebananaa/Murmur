name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Room mode (npm start) is cross-platform; classic mode uses POSIX process groups, so it is tested on macOS/Linux only.
      - run: node --test --test-concurrency=1 test/room.test.ts
      - if: runner.os != 'Windows'
        run: npm test
